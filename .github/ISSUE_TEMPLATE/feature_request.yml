name: Feature or accuracy request
description: A model, data source or view to add, or a check against a reference
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: The source it should be checked against (a paper, a NASA or JPL dataset, a textbook example by number), if there is one.
